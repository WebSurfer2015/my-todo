# Flow 19 — Every completion has Undo (Phase 2, 2026-10-18).
# Swipe RIGHT → "Mark done" → "Done: <title> · Undo" → Undo → the row is
# open again.
#
# Row choice: "Review reading group chapter" (seeded, THIS WEEK, no steps,
# not recurring). It must NOT be a row another nightly flow mutates — flow
# 03 completes "Refill prescription" and leaves it done, so pointing this
# flow at the same row made it fail on every nightly run. Undo restores
# the row, so this flow leaves the seed as it found it.
appId: com.websurfer.mytodo
---
- stopApp
- launchApp
- tapOn:
    text: "Todos, tab.*"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: ".*Review reading group chapter.*"
    direction: DOWN
# Row body tap OPENS a to-do; complete via the swipe "Mark done" action
# (a row is one VoiceOver element, so the circle isn't separately targetable).
- swipe:
    from:
      text: ".*Review reading group chapter.*"
    direction: RIGHT
    duration: 600
- runFlow:
    when:
      visible: "Mark done"
    commands:
      - tapOn: "Mark done"
- extendedWaitUntil:
    visible:
      text: "Done: Review reading group chapter.*"
    timeout: 4000
- tapOn: "Undo"
- waitForAnimationToEnd
# Open again. The row's a11y label is "<title>, <state/date/category/…>";
# a done row reads "<title>, completed, …" — so assert the row is present
# AND that it no longer says completed (a prefix match alone would pass even
# if Undo broke, since a just-completed row stays mounted).
- assertVisible:
    text: "Review reading group chapter.*"
- assertNotVisible:
    text: "Review reading group chapter, completed.*"
