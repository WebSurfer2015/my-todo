# Flow 15 — Long-press (or tap) a todo opens TaskDetailsSheet (Steps
# section renders).
# Session manual-plan P1.6 (subtasks) — RENDER-ONLY.
#
# Scope: long-press opens the edit/details sheet; we assert the "Steps"
# (subtasks) section is present. Committing a subtask is NOT scripted —
# TaskDetailsSheet is a <Modal> whose outer wrapper concatenates child
# a11y labels (see README "Known a11y limitation"), so tapping the inner
# "Add a step…" affordance lands on the parent center, not the field.
# assertVisible still works via substring against the concatenated label.
#
# Precondition: seeded row "Buy groceries".
# The row's own a11y label already contains "… of 2 steps done", so a
# "Steps" match alone would pass before the sheet opens — assert the
# sheet-only "Add a step" affordance instead (absent before, present after).
appId: com.websurfer.mytodo
---
- stopApp
- launchApp
- tapOn:
    text: "Todos, tab.*"
- assertNotVisible:
    text: ".*Add a step.*"
# Both a body tap and a long-press open the details/edit sheet.
- longPressOn: ".*Buy groceries.*"
- waitForAnimationToEnd:
    timeout: 1500
# Only the details sheet renders the "Add a step" affordance.
- assertVisible:
    text: ".*Add a step.*"
