# Flow 20 — One-screen onboarding (Settings → View intro again).
# Starter chips PRE-FILL (never send); "I'll look around first" lands on Today.
# No AI call is made.
appId: com.websurfer.mytodo
---
- stopApp
- launchApp
- tapOn:
    id: "settings-button"
- scrollUntilVisible:
    element: "View Mochi's intro again"
    direction: DOWN
- tapOn: "View Mochi's intro again"
- extendedWaitUntil:
    visible: "Hi, I'm Mochi."
    timeout: 8000
- assertVisible: ".*Anthropic.*"
- tapOn: "Call someone"
- assertVisible: "Call someone "
# hideKeyboard is flaky on the iOS sim (README) — tapping the heading
# dismisses it (the ScrollView uses keyboardShouldPersistTaps="handled").
- tapOn: "Hi, I'm Mochi."
- tapOn: "I'll look around first"
- waitForAnimationToEnd
- assertVisible: "Today, tab, 1 of 3"
