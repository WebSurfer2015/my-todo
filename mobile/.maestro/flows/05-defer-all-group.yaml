# Flow 05 — A section header's "Defer all →" opens the bulk-defer modal,
# pick Tomorrow. Manual-plan tests 7.5–7.7.
#
# "Defer all →" appears only on an expanded CARRIED OVER group (and on
# the Carried over filter view). We filter to "Carried over" (funnel →
# status row → "Show results") so exactly one "Defer all →" shows and the
# target group is unambiguous. Carried over seeds 2 items, so the modal title
# is "Defer all to" (count > 1).
#
# NOTE: the "Defer all →" touchable sets an accessibilityLabel
# ("Defer all carried-over to-dos" / "Defer all to-dos in <group>") which
# OVERRIDES the visible "Defer all →" text on iOS — so Maestro sees the
# label, not "Defer all". Both label variants contain "to-dos", so we
# match on that.
appId: com.websurfer.mytodo
---
- stopApp
- launchApp
- tapOn:
    text: "Todos, tab.*"
- tapOn:
    text: "Filter"
- tapOn:
    text: ".*Carried over.*"
- tapOn:
    text: "Show results"
- waitForAnimationToEnd
- tapOn:
    text: ".*Defer.*to-dos.*"
- assertVisible: ".*Defer all to.*"
# First preset row commits + dismisses.
- tapOn:
    text: "Tomorrow|Next day"
- waitForAnimationToEnd
