# Flow 01 — Cold launch lands on Today tab.
# Manual-plan test 1.1 + 3.1.
#
# Selector notes: Maestro matches against the iOS accessibility tree,
# not raw React Native Text content. Raw <Text>TODAY</Text> isn't
# searchable because the wrapping Pressable's accessibilityLabel
# ("Open Todos showing N items") shadows it. We target tree-visible
# strings instead: the Today tab's "tab, 1 of 3" axId and the
# section wrapper's accessibilityLabel.
#
# v1.5: Home tab was renamed to "Today" in the user-facing copy
# (Phase 1A — see task #18 in the activity log).
appId: com.websurfer.mytodo
---
- stopApp
- launchApp
# Today tab is the active one of three.
- assertVisible: "Today, tab, 1 of 3"
# TODAY section is rendered — the wrapping Pressable has this aria
# label. Bare strings in assertVisible match exactly; switch to the
# `text:` form for regex/substring.
- assertVisible:
    text: "Open Todos.*|Welcome.*|You.re all caught up.*|Nothing pending.*|Nothing due today.*"
# NOTE: removed the stale "What's Next.*" sentinel — it's no longer
# rendered on the Today (verified on-device: the screen shows the
# TODAY list + stat tiles, no teaser). The two assertions above
# (Today tab active + TODAY section present) are the smoke signal.
