name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Repo layout: core/ (pure TS domain, tested + gated from the repo root),
# mobile/ (Expo / React Native iOS app), functions/ (Firebase Cloud Functions
# backend; firestore.rules + firebase.json live at the repo root).
jobs:
  core:
    name: core typecheck + tests + coverage gate + lint:arch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install root deps (vitest, typescript, dependency-cruiser)
        run: npm ci
      - name: Clean-architecture gate
        run: npm run lint:arch
      - name: Typecheck core
        run: npm run typecheck:core
      - name: Core tests + coverage gate (thresholds in vitest.config.ts)
        run: npm run test:coverage

  mobile:
    name: mobile lint + typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install
        working-directory: mobile
        run: npm ci --legacy-peer-deps
      - name: Lint (zero warnings)
        working-directory: mobile
        run: npm run lint
      - name: Typecheck
        working-directory: mobile
        run: npx tsc --noEmit -p tsconfig.json
      - name: Test
        working-directory: mobile
        run: npm test

  functions:
    name: cloud functions typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install
        working-directory: functions
        run: npm ci --legacy-peer-deps
      - name: Typecheck
        working-directory: functions
        run: npx tsc --noEmit
      - name: Test + coverage gate (thresholds in functions/vitest.config.ts)
        working-directory: functions
        run: npm run test:coverage

  rules:
    name: firestore rules (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Set up Java (Firestore emulator — firebase-tools needs JDK 21+)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install
        working-directory: functions
        run: npm ci --legacy-peer-deps
      # test:rules shells out to `firebase` — install the CLI (pinned to the
      # version used locally). It finds firebase.json at the repo root.
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.17.0
      - name: Rules tests against the Firestore emulator
        working-directory: functions
        run: npm run test:rules
